name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Frontend dependencies
        run: npm ci
      - name: Frontend lint
        run: npm run lint
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Backend dependencies
        working-directory: server
        run: npm ci
      - name: Backend syntax
        working-directory: server
        run: npm run check
      - name: Backend tests
        working-directory: server
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/ksmcitest
          TESTMONGOURI: mongodb://127.0.0.1:27017/ksmcitest
        run: npm test
